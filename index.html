<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLAN_STEP // STOCK MARKET TERMINAL</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --bg-dark: #041421;
            --panel-bg: #082f49;
            --border-cyan: #06b6d4;
            --text-light-blue: #7dd3fc;
            --text-cyan: #22d3ee;
            --text-white: #f0f9ff;
            --neon-green: #00ff9d;
            --neon-red: #fb7185;
            --neon-yellow: #fde047;
            --input-bg: #021a2c;
            --table-bg: #f0fdfa;
            --table-text-dark: #0f172a;
            --table-th-bg: #ccfbf1;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light-blue);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px 0;
            -webkit-text-size-adjust: 100%;
        }

        .container { max-width: 950px; margin-top: 1rem; margin-bottom: 3rem; }

        .terminal-header {
            color: var(--text-cyan);
            text-align: center;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-size: 1.5rem;
        }

        .card-stock {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-cyan);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.6);
            margin-bottom: 1.5rem;
        }

        .form-label { color: var(--text-light-blue); font-weight: bold; font-size: 0.9rem; }
        
        .form-control-stock, .form-select-stock {
            background-color: var(--input-bg);
            border: 1px solid #0e7490;
            color: var(--text-light-blue);
            border-radius: 6px;
            font-size: 1rem;
            padding: 10px;
        }
        .form-control-stock:focus, .form-select-stock:focus {
            background-color: var(--input-bg);
            color: var(--text-white);
            border-color: var(--text-cyan);
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
            outline: none;
        }

        .order-info-box {
            background-color: var(--input-bg);
            border-left: 4px solid var(--text-cyan);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }
        .order-info-text { font-size: 0.9rem; color: var(--text-white); margin-bottom: 4px; }
        .order-info-hl { color: var(--text-cyan); font-weight: bold; }

        .btn-cyan { background-color: #0891b2; color: white; font-weight: bold; border: none; }
        .btn-cyan:hover { background-color: #0e7490; color: white; }
        .btn-outline-cyan { border: 1px solid var(--text-cyan); color: var(--text-cyan); font-weight: bold; }
        .btn-outline-cyan:hover { background-color: var(--text-cyan); color: var(--bg-dark); }

        /* ตารางสไตล์กระดานหุ้นตัวหนังสือเข้ม */
        #tableSection { display: none; }
        .table-wrapper {
            background-color: var(--table-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
        }
        .filter-box { 
            background-color: #e0f2fe; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            border: 1px dashed #0ea5e9;
            color: var(--table-text-dark);
        }
        
        .stock-table { color: var(--table-text-dark); font-size: 0.85rem; }
        .stock-table th { 
            background-color: var(--table-th-bg); 
            color: var(--table-text-dark); 
            border-bottom: 2px solid #14b8a6; 
            white-space: nowrap; 
            font-weight: bold; 
        }
        .stock-table td { vertical-align: middle; border-color: #99f6e4; white-space: nowrap; color: var(--table-text-dark); }
        .stock-table tbody tr:hover { background-color: #e2e8f0; }
        
        .btn-action { padding: 3px 8px; font-size: 0.75rem; font-weight: bold; border-radius: 4px; }
        .btn-edit { background-color: #f59e0b; color: white; border: none; margin-right: 4px; }
        .btn-delete { background-color: #ef4444; color: white; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="terminal-header">📈 PLAN_STEP // STOCK TERMINAL</h2>
    
    <!-- ฟอร์มกรอกข้อมูล -->
    <div class="card card-stock">
        <form id="planForm">
            <input type="hidden" id="edit_mode" value="false">
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">📝 เลขที่ใบสั่ง (Order No)</label>
                    <select id="id_order" class="form-select form-select-stock" required onchange="onOrderSelect()">
                        <option value="">-- โหลดข้อมูลใบสั่ง --</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">⚙️ ขั้นตอนทำงาน (Step Name)</label>
                    <select id="id_step" class="form-select form-select-stock" required>
                        <option value="">-- กรุณาเลือกใบสั่งก่อน --</option>
                    </select>
                </div>
            </div>

            <!-- กล่องแสดงรหัสชิ้นงานและวันกำหนดเสร็จของใบสั่ง -->
            <div id="orderInfo" class="order-info-box">
                <div class="row">
                    <div class="col-md-6 order-info-text mb-2 border-bottom border-secondary pb-2">
                        รหัสชิ้นงาน: <span id="display_work_code" class="order-info-hl text-warning">-</span>
                    </div>
                    <div class="col-md-6 order-info-text mb-2 border-bottom border-secondary pb-2 text-md-end">
                        จำนวนสั่งผลิต: <span id="display_order_qty" style="color: var(--neon-green); font-weight: bold; font-size: 1.1em;">-</span> ชิ้น
                    </div>
                    <div class="col-md-6 order-info-text mt-2">
                        วันเริ่มใบสั่ง: <span id="display_order_start" class="order-info-hl">-</span>
                    </div>
                    <div class="col-md-6 order-info-text mt-2 text-md-end">
                        กำหนดเสร็จใบสั่ง: <span id="display_order_end" class="order-info-hl text-danger">-</span>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">📅 วันเริ่ม (orders_step.start_date)</label>
                    <input type="date" id="start_date" class="form-control form-control-stock" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">🚩 กำหนดเสร็จ (orders_step.end_date)</label>
                    <input type="date" id="end_date" class="form-control form-control-stock" required>
                </div>
            </div>

            <div class="d-flex gap-2 mt-2">
                <button type="button" class="btn btn-cyan w-100 py-2" id="btnSave" onclick="saveData()">[+] บันทึกข้อมูล (SAVE)</button>
                <button type="button" class="btn btn-secondary w-25" id="btnCancelEdit" style="display:none;" onclick="cancelEdit()">ยกเลิก</button>
            </div>
        </form>
    </div>

    <!-- ปุ่มควบคุมการแสดงตารางข้อมูล -->
    <div class="text-center mb-4" id="showTableBtnContainer">
        <button class="btn btn-outline-cyan px-4 py-2" onclick="toggleTableSection()">
            📊 แสดงตารางรายละเอียดข้อมูล
        </button>
    </div>

    <!-- ส่วนแสดงตารางรายละเอียดข้อมูลด้านล่าง -->
    <div id="tableSection">
        <div class="table-wrapper">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h5 style="color: var(--table-text-dark); font-weight: bold; margin:0;">ตารางข้อมูลแผนงานทั้งหมด (Order Steps Matrix)</h5>
                <button class="btn btn-sm btn-primary fw-bold" onclick="loadTableData()">รีเฟรชข้อมูล</button>
            </div>

            <!-- ช่องกรองตามเลขที่ใบสั่งทันที -->
            <div class="filter-box d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div style="flex: 1; min-width: 250px;">
                    <label class="form-label mb-1 text-dark" style="font-size:0.85rem;">🔍 กรองข้อมูลตามเลขที่ใบสั่ง (Filter Order)</label>
                    <select id="filter_order" class="form-select border-primary text-dark" onchange="renderTable()">
                        <option value="">-- แสดงทั้งหมดทุกใบสั่ง --</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table stock-table align-middle">
                    <thead>
                        <tr>
                            <th>เลขที่ใบสั่ง (Order No)</th>
                            <th>รหัสชิ้นงาน (Work Code)</th>
                            <th>ขั้นตอนทำงาน (Step Name)</th>
                            <th>วันเริ่ม (Start Date)</th>
                            <th>กำหนดเสร็จ (End Date)</th>
                            <th class="text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <tr><td colspan="6" class="text-center text-muted">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const BASE_URL = 'https://siiiifesdjuunwmwozfb.supabase.co/rest/v1';
    const SUPABASE_KEY = 'sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT';
    const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

    let refData = { orders: {}, steps: {}, targets: [], works: {} };
    let tableData = []; 
    let isTableLoaded = false;

    window.onload = async function() {
        document.getElementById('start_date').valueAsDate = new Date();
        document.getElementById('end_date').valueAsDate = new Date();

        Swal.fire({ title: 'เชื่อมต่อฐานข้อมูล...', background: '#082f49', color: '#22d3ee', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

        try {
            // เพิ่มการดึง quantity เข้ามาใน Query
            const [orders, steps, targets, works] = await Promise.all([
                fetch(`${BASE_URL}/orders?select=id_order,order_no,id_work,start_date,end_date,quantity`, { headers }).then(r => r.json()),
                fetch(`${BASE_URL}/production_steps?select=id_step,step_name`, { headers }).then(r => r.json()),
                fetch(`${BASE_URL}/targets?select=id_work,id_step`, { headers }).then(r => r.json()),
                fetch(`${BASE_URL}/work_items?select=id_work,work_code`, { headers }).then(r => r.json())
            ]);

            const selectOrder = document.getElementById('id_order');
            const filterOrder = document.getElementById('filter_order');
            
            selectOrder.innerHTML = `<option value="">-- เลือกเลขที่ใบสั่ง --</option>`;
            filterOrder.innerHTML = `<option value="">-- แสดงทั้งหมดทุกใบสั่ง --</option>`;
            
            orders.forEach(o => {
                refData.orders[o.id_order] = o;
                let optStr = `<option value="${o.id_order}">${o.order_no}</option>`;
                selectOrder.innerHTML += optStr;
                filterOrder.innerHTML += optStr;
            });

            steps.forEach(s => refData.steps[s.id_step] = s.step_name);
            works.forEach(w => refData.works[w.id_work] = w.work_code);
            refData.targets = targets;

            Swal.close();

            const urlParams = new URLSearchParams(window.location.search);
            const paramOrderId = urlParams.get('order_id');
            if (paramOrderId && refData.orders[paramOrderId]) {
                selectOrder.value = paramOrderId;
                onOrderSelect();
            }

        } catch (error) {
            Swal.fire({icon: 'error', title: 'Error', text: 'เชื่อมต่อฐานข้อมูลล้มเหลว', background: '#082f49', color: 'white'});
        }
    };

    // เมื่อเลือกเลขที่ใบสั่ง ให้ดึงรหัสชิ้นงาน จำนวน วันกำหนดเสร็จ พร้อมอัปเดตตารางเรียลไทม์
    async function onOrderSelect() {
        const orderId = document.getElementById('id_order').value;
        const infoBox = document.getElementById('orderInfo');
        const selectStep = document.getElementById('id_step');
        
        selectStep.innerHTML = `<option value="">-- เลือกขั้นตอนการทำงาน --</option>`;

        // 1. นำค่าใบสั่งไปใส่ในช่องกรองตารางด้านล่าง
        document.getElementById('filter_order').value = orderId || "";

        // 2. แสดงตารางและโหลดข้อมูลทันทีเพื่อโชว์แบบ Real-time
        const tableSec = document.getElementById('tableSection');
        if (orderId) {
            tableSec.style.display = 'block';
            if (!isTableLoaded) {
                await loadTableDataRaw(); // โหลดเงียบๆ ไม่เด้ง Alert
                isTableLoaded = true;
            }
        }
        renderTable(); // อัปเดตตารางให้กรองเฉพาะ Order นี้

        if (orderId && refData.orders[orderId]) {
            const orderInfo = refData.orders[orderId];
            const workCode = refData.works[orderInfo.id_work] || 'ไม่พบรหัสชิ้นงาน';
            
            // แสดงข้อมูลรวมถึงจำนวนสั่งผลิต
            document.getElementById('display_work_code').innerText = workCode;
            document.getElementById('display_order_qty').innerText = orderInfo.quantity ? Number(orderInfo.quantity).toLocaleString() : '-';
            document.getElementById('display_order_start').innerText = orderInfo.start_date || 'ไม่ระบุ';
            document.getElementById('display_order_end').innerText = orderInfo.end_date || 'ไม่ระบุ';
            infoBox.style.display = 'block';

            if (orderInfo.id_work) {
                const validSteps = refData.targets.filter(t => t.id_work === orderInfo.id_work);
                const uniqueStepIds = [...new Set(validSteps.map(t => t.id_step))];
                
                if(uniqueStepIds.length > 0) {
                    uniqueStepIds.forEach(stepId => {
                        let stepName = refData.steps[stepId] || `Step ID: ${stepId}`;
                        selectStep.innerHTML += `<option value="${stepId}">${stepName}</option>`;
                    });
                } else {
                    selectStep.innerHTML = `<option value="">-- ไม่พบขั้นตอนที่สัมพันธ์กับใบสั่งนี้ --</option>`;
                }
            } else {
                selectStep.innerHTML = `<option value="">-- ใบสั่งนี้ไม่มีข้อมูลรหัสชิ้นงาน --</option>`;
            }
        } else {
            infoBox.style.display = 'none';
            selectStep.innerHTML = `<option value="">-- กรุณาเลือกใบสั่งก่อน --</option>`;
        }
    }

    // บันทึกข้อมูลลงตาราง orders_step
    async function saveData() {
        const id_order = document.getElementById('id_order').value;
        const id_step = document.getElementById('id_step').value;
        const start_date = document.getElementById('start_date').value;
        const end_date = document.getElementById('end_date').value;
        const isEditMode = document.getElementById('edit_mode').value === 'true';

        if (!id_order || !id_step || !start_date || !end_date) {
            Swal.fire({icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกข้อมูลให้ครบถ้วน', background: '#082f49', color: 'white'}); 
            return;
        }

        const payload = {
            id_order: parseInt(id_order),
            id_step: parseInt(id_step),
            start_date: start_date,
            end_date: end_date
        };

        document.getElementById('btnSave').disabled = true;

        try {
            if (!isEditMode) {
                const checkRes = await fetch(`${BASE_URL}/order_steps?id_order=eq.${id_order}&id_step=eq.${id_step}&select=id_order`, { headers });
                const existingData = await checkRes.json();
                
                if (existingData.length > 0) {
                    Swal.fire({icon: 'error', title: 'ข้อมูลซ้ำ!', text: 'ใบสั่งนี้ได้บันทึกขั้นตอนนี้ไปแล้ว', background: '#082f49', color: 'white'});
                    document.getElementById('btnSave').disabled = false;
                    return;
                }

                const res = await fetch(`${BASE_URL}/order_steps`, {
                    method: 'POST', headers: { ...headers, 'Prefer': 'return=minimal' }, body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Save Failed');
            
            } else {
                const res = await fetch(`${BASE_URL}/order_steps?id_order=eq.${id_order}&id_step=eq.${id_step}`, {
                    method: 'PATCH', headers: { ...headers, 'Prefer': 'return=minimal' }, body: JSON.stringify({ start_date, end_date })
                });
                if (!res.ok) throw new Error('Update Failed');
                cancelEdit(); 
            }

            Swal.fire({icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false, background: '#082f49', color: '#22d3ee'});
            
            document.getElementById('start_date').valueAsDate = new Date();
            document.getElementById('end_date').valueAsDate = new Date();

            // อัปเดตตารางเรียลไทม์
            if (isTableLoaded) {
                document.getElementById('filter_order').value = id_order;
                await loadTableDataRaw();
                renderTable();
            }

        } catch (e) {
            Swal.fire({icon: 'error', title: 'Error', text: 'เกิดข้อผิดพลาดในการบันทึกข้อมูล', background: '#082f49', color: 'white'});
        } finally {
            document.getElementById('btnSave').disabled = false;
        }
    }

    async function toggleTableSection() {
        const tableSec = document.getElementById('tableSection');
        if (tableSec.style.display === 'block') {
            tableSec.style.display = 'none';
        } else {
            tableSec.style.display = 'block';
            if (!isTableLoaded) {
                await loadTableData();
            }
        }
    }

    async function loadTableDataRaw() {
        const res = await fetch(`${BASE_URL}/order_steps?select=*&order=start_date.desc`, { headers });
        tableData = await res.json();
    }

    async function loadTableData() {
        Swal.fire({ title: 'กำลังโหลดข้อมูล...', background: '#082f49', color: '#22d3ee', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
        try {
            await loadTableDataRaw();
            isTableLoaded = true;
            renderTable();
            Swal.close();
        } catch(e) {
            Swal.fire({icon: 'error', title: 'Error', text: 'ดึงข้อมูลไม่สำเร็จ', background: '#082f49', color: 'white'});
        }
    }

    function renderTable() {
        const filterVal = document.getElementById('filter_order').value;
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';

        let filtered = tableData;
        if (filterVal) {
            filtered = tableData.filter(row => row.id_order == filterVal);
        }

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-secondary">ไม่พบข้อมูลที่ตรงกับเงื่อนไข</td></tr>';
            return;
        }

        filtered.forEach(row => {
            let orderObj = refData.orders[row.id_order];
            let orderNo = orderObj ? orderObj.order_no : row.id_order;
            let workCode = orderObj && refData.works[orderObj.id_work] ? refData.works[orderObj.id_work] : '-';
            let stepName = refData.steps[row.id_step] || row.id_step;

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="fw-bold" style="color: #0369a1;">${orderNo}</td>
                <td style="color: #0f766e; font-weight: bold;">${workCode}</td>
                <td>${stepName}</td>
                <td>${row.start_date || '-'}</td>
                <td style="color: #dc2626; font-weight: 500;">${row.end_date || '-'}</td>
                <td class="text-center">
                    <button class="btn-action btn-edit" onclick="verifyPin(() => triggerEdit(${row.id_order}, ${row.id_step}, '${row.start_date}', '${row.end_date}'))">แก้ไข</button>
                    <button class="btn-action btn-delete" onclick="verifyPin(() => deleteRecord(${row.id_order}, ${row.id_step}))">ลบ</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function verifyPin(actionCallback) {
        const { value: pin } = await Swal.fire({
            title: '🔒 ยืนยันตัวตน',
            text: 'กรุณาใส่รหัสผ่านเพื่อดำเนินการ (112233)',
            input: 'password',
            inputAttributes: { autocapitalize: 'off' },
            showCancelButton: true,
            confirmButtonText: 'ตกลง',
            cancelButtonText: 'ยกเลิก',
            background: '#041421', color: '#7dd3fc',
            customClass: { confirmButton: 'btn btn-cyan', cancelButton: 'btn btn-secondary' }
        });

        if (pin === '112233') {
            actionCallback();
        } else if (pin !== undefined) {
            Swal.fire({ icon: 'error', title: 'รหัสไม่ถูกต้อง', text: 'คุณไม่มีสิทธิ์ทำรายการนี้', background: '#041421', color: '#fb7185' });
        }
    }

    function triggerEdit(id_order, id_step, start_date, end_date) {
        document.getElementById('id_order').value = id_order;
        onOrderSelect();
        
        setTimeout(() => {
            document.getElementById('id_step').value = id_step;
        }, 150);

        document.getElementById('start_date').value = start_date;
        document.getElementById('end_date').value = end_date;
        
        document.getElementById('id_order').disabled = true;
        document.getElementById('id_step').disabled = true;
        
        document.getElementById('edit_mode').value = 'true';
        document.getElementById('btnSave').innerText = '[*] บันทึกการแก้ไข (UPDATE)';
        document.getElementById('btnSave').classList.replace('btn-cyan', 'btn-warning');
        document.getElementById('btnCancelEdit').style.display = 'block';
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        document.getElementById('id_order').disabled = false;
        document.getElementById('id_step').disabled = false;
        document.getElementById('planForm').reset();
        document.getElementById('start_date').valueAsDate = new Date();
        document.getElementById('end_date').valueAsDate = new Date();
        
        onOrderSelect();
        
        document.getElementById('edit_mode').value = 'false';
        document.getElementById('btnSave').innerText = '[+] บันทึกข้อมูล (SAVE)';
        document.getElementById('btnSave').classList.replace('btn-warning', 'btn-cyan');
        document.getElementById('btnCancelEdit').style.display = 'none';
    }

    async function deleteRecord(id_order, id_step) {
        const confirmDelete = await Swal.fire({
            title: 'ยืนยันการลบ?',
            text: "ข้อมูลนี้จะถูกลบออกจากระบบอย่างถาวร!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'ลบทิ้ง',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#ef4444',
            background: '#041421', color: '#7dd3fc'
        });

        if (confirmDelete.isConfirmed) {
            try {
                const res = await fetch(`${BASE_URL}/order_steps?id_order=eq.${id_order}&id_step=eq.${id_step}`, {
                    method: 'DELETE', headers: headers
                });
                if (res.ok) {
                    Swal.fire({icon: 'success', title: 'ลบข้อมูลสำเร็จ', timer: 1500, showConfirmButton: false, background: '#041421', color: '#7dd3fc'});
                    if (isTableLoaded) {
                        await loadTableDataRaw();
                        renderTable();
                    }
                } else {
                    throw new Error('Delete Failed');
                }
            } catch (e) {
                Swal.fire({icon: 'error', title: 'Error', text: 'ลบข้อมูลไม่สำเร็จ', background: '#041421', color: '#7dd3fc'});
            }
        }
    }
</script>
</body>
